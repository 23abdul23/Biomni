services:
  biomni:
    build:
      context: .
      args:
        HTTP_PROXY: "http://172.31.2.4:8080"
        HTTPS_PROXY: "http://172.31.2.4:8080"
        NO_PROXY: "localhost,127.0.0.1"
    image: biomni:local
    tty: true
    stdin_open: true
    environment:
      - HTTP_PROXY=http://172.31.2.4:8080
      - HTTPS_PROXY=http://172.31.2.4:8080
      - http_proxy=http://172.31.2.4:8080
      - https_proxy=http://172.31.2.4:8080
      - NO_PROXY=localhost,127.0.0.1
      - no_proxy=localhost,127.0.0.1
      - ANTHROPIC_API_KEY
      - OPENAI_API_KEY
      - OPENAI_ENDPOINT
      - GEMINI_API_KEY
      - GROQ_API_KEY
      - LLM_SOURCE
      - AWS_BEARER_TOKEN_BEDROCK
      - AWS_REGION
      - CUSTOM_MODEL_BASE_URL
      - CUSTOM_MODEL_API_KEY
      - BIOMNI_DATA_PATH=/opt/biomni/data
      - BIOMNI_TIMEOUT_SECONDS
    ports:
      - "7860:7860"
    volumes:
      - ./data:/opt/biomni/data
